<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VRC Favorite World History</title>
    <link rel="stylesheet" href="styles/popup.css">
    <link rel="stylesheet" href="styles/auth-status.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand">
        <img src="icons/icon48.png" width="32" height="32" alt="">
        <h1>お気に入りワールド記録</h1>
      </header>

      <section id="attention-card" class="attention-card" aria-live="polite">
        <p class="sync-section-label">前回の同期結果</p>
        <h2 id="attention-title">保存済みの状態を確認しています</h2>
        <p id="attention-detail">しばらくお待ちください。</p>
        <button id="dashboard-button" class="button button-primary" type="button">名前と画像を見る</button>
      </section>

      <section id="status-card" class="status-card" aria-live="polite" hidden>
        <div class="status-line">
          <span id="status-dot" class="status-dot is-idle" aria-hidden="true"></span>
          <strong id="status-title">状態を確認しています</strong>
        </div>
        <p id="status-detail">しばらくお待ちください。</p>
      </section>

      <button id="login-button" class="button button-secondary" type="button" hidden>VRChat公式サイトを開く</button>
      <button id="sync-button" class="button button-secondary" type="button" disabled>今すぐ確認</button>
      <p id="unread-summary" class="muted" hidden></p>
      <p id="last-sync" class="muted">前回の同期成功: まだありません</p>
      <p id="action-message" class="action-message" role="status"></p>

      <section id="auth-status-panel" class="auth-status-panel" aria-labelledby="auth-section-title">
        <div class="auth-status-heading">
          <h2 id="auth-section-title">現在のログイン確認</h2>
          <button id="auth-recheck-button" class="button button-secondary" type="button" aria-label="ログイン状態を再確認" disabled>再確認</button>
        </div>
        <div aria-live="polite">
          <strong id="auth-status-title">ログイン状態を確認しています…</strong>
          <p id="auth-status-detail">お気に入りの同期とは別に確認しています。</p>
          <p id="auth-checked-at" class="muted">確認時刻: 未確認</p>
          <p id="auth-retry-at" class="muted" hidden></p>
        </div>
        <p class="auth-cache-note">再確認でも60秒以内は同じ結果を表示します</p>
        <button id="auth-open-vrchat-button" class="button button-secondary" type="button" hidden>VRChat公式サイトを開く</button>
        <p id="auth-action-message" class="action-message" role="status"></p>
      </section>

      <details class="record-status">
        <summary>画像の保存状況</summary>
        <p id="thumbnail-progress" class="muted" role="status" hidden></p>
      </details>
      <footer>記録はこのブラウザ内だけに保存されます</footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
